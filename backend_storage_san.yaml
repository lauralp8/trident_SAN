apiVersion: trident.netapp.io/v1
kind: TridentBackendConfig
metadata:
  name: backend-ontap-san-lab
  namespace: trident
spec:
  version: 1
  backendName: ontap-san-lab-backend
  storageDriverName: ontap-san
  useREST: true
  managementLIF: 192.168.0.135
  dataLIF: 192.168.0.136
  svm: svm_iscsi
  storagePrefix: lab
  labels:
    backend: us-east1
    environment: test
  aggregate: aggr1
  limitAggregateUsage: '80'
  limitVolumeSize: 500Gi
  lunsPerFlexvol: '100'
  sanType: fcp
  # formatOptions: ''
  # limitVolumePoolSize: ''
  denyNewVolumePools: 'false'
  defaults:
    spaceReserve: none
    spaceAllocation: 'true'
    snapshotPolicy: default
    snapshotReserve: none
    encryption: 'false'
    # qosPolicy: ''
    # adaptiveQosPolicy: ''
    tieringPolicy: none
    # luksEncryption: ''
    # nameTemplate: ''
  debugTraceFlags:
    api: false
    method: false
  credentials:
    name: trident-creds

---

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ontap-san-lab
  annotations:
    storageclass.kubernetes.io/is-default-class: 'false'
    argocd.argoproj.io/sync-wave: '5'
provisioner: csi.trident.netapp.io
reclaimPolicy: Delete
parameters:
  backendType: ontap-san
  fsType: ext4
  provisioningType: thin
  snapshots: 'true'
allowVolumeExpansion: true
volumeBindingMode: Immediate
