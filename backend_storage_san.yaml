apiVersion: trident.netapp.io/v1
kind: TridentBackendConfig
metadata:
  name: backend-jc-san
  namespace: trident
spec:
  version: 1
  backendName: ontap-san_sansvm_demo_netapp_com
  storageDriverName: ontap-san
  useREST: true
  managementLIF: sansvm-mgmt.demo.netapp.com
  dataLIF: sansvm.demo.netapp.com
  svm: sansvm
  storagePrefix: trident
  useCHAP: true
  # labels: ''
  # aggregate: ''
  # limitAggregateUsage: ''
  # limitVolumeSize: ''
  lunsPerFlexvol: '100'
  sanType: iscsi
  # formatOptions: ''
  # limitVolumePoolSize: ''
  denyNewVolumePools: 'false'
  defaults:
    spaceReserve: none
    spaceAllocation: 'true'
    snapshotPolicy: none
    snapshotReserve: none
    encryption: 'false'
    # qosPolicy: ''
    # adaptiveQosPolicy: ''
    tieringPolicy: none
    # luksEncryption: ''
    # nameTemplate: ''
  debugTraceFlags:
    api: false
    method: false
  credentials:
    name: trident-creds

---

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rhoso-san
  annotations:
    storageclass.kubernetes.io/is-default-class: 'true'
    argocd.argoproj.io/sync-wave: '5'
provisioner: csi.trident.netapp.io
reclaimPolicy: Delete
parameters:
  backendType: ontap-san
  fsType: ext4
  provisioningType: thin
  snapshots: 'true'
allowVolumeExpansion: true
volumeBindingMode: Immediate
