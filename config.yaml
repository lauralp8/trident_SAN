# ================================================================================
# CONFIGURACIÓN TRIDENT SAN - Solo edita los valores necesarios
# ================================================================================
# 
# INSTRUCCIONES:
#   1. Edita solo los valores a la DERECHA de los dos puntos (:)
#   2. NO borres las líneas, solo cambia los valores
#   3. Los campos con # delante son opcionales (puedes ignorarlos)
#   4. Para usar un campo opcional, quita el # del inicio de la línea
#
# ================================================================================

# BACKEND - Configuración del almacenamiento NetApp
backend:
  # === CAMPOS OBLIGATORIOS ===
  managementLIF: 192.168.0.135
  dataLIF: 192.168.0.136
  svm: svm_iscsi
  credentials:
    name: trident-creds
  
  # === CAMPOS OPCIONALES - Metadatos y configuración básica ===
  name: backend-ontap-san-lab
  namespace: trident
  version: 1
  backendName: ontap-san-lab-backend
  storageDriverName: ontap-san
  useREST: true
  storagePrefix: lab
  
  # === PARÁMETROS CHAP ===
  # Habilita la autenticación CHAP bidireccional para iSCSI.
  # IMPORTANTE: En versiones recientes de Trident con TridentBackendConfig,
  # los valores CHAP NO se definen aquí, van en secret.yaml
  # Solo useCHAP se define en el backend para habilitar la funcionalidad.
  useCHAP: true
  # Los siguientes campos CHAP se definen en secret.yaml:
  #   - chapInitiatorSecret
  #   - chapTargetInitiatorSecret  
  #   - chapUsername
  #   - chapTargetUsername
  
  # === OTROS PARÁMETROS ===
  labels: "environment=lab,tier=gold"
  # Los siguientes campos de certificados se definen en secret.yaml (forbidden attributes):
  # clientCertificate: ""         # Certificado del cliente (Base64) - va en secret.yaml
  # clientPrivateKey: ""          # Clave privada del cliente (Base64) - va en secret.yaml
  # trustedCACertificate: ""      # Certificado CA de confianza (Base64) - va en secret.yaml
  aggregate: aggr1
  limitAggregateUsage: "80"
  limitVolumeSize: "500Gi"
  # limitVolumePoolSize: ""
  lunsPerFlexvol: "100"
  sanType: iscsi
  # formatOptions: ""
  denyNewVolumePools: "false"
  
  # === DEBUG FLAGS ===
  debugTraceFlags:
    api: false
    method: false
  
  # === DEFAULTS DE VOLÚMENES ===
  defaults:
    spaceReserve: none
    spaceAllocation: "true"
    snapshotPolicy: default
    snapshotReserve: none
    encryption: "false"
    qosPolicy: ""
    adaptiveQosPolicy: ""
    tieringPolicy: none
    luksEncryption: ""
    nameTemplate: ""

# STORAGE CLASS - Nombre del storage class en Kubernetes/OpenShift
storageClass:
  # === CAMPOS OBLIGATORIOS ===
  name: ontap-san-lab
  
  # === CAMPOS OPCIONALES - Configuración del StorageClass ===
  isDefault: false
  syncWave: "5"
  provisioner: csi.trident.netapp.io
  reclaimPolicy: Delete  # Opciones: Delete, Retain
  allowVolumeExpansion: true
  volumeBindingMode: Immediate  # Opciones: Immediate, WaitForFirstConsumer
  
  # === PARÁMETROS DEL STORAGE CLASS ===
  parameters:
    backendType: ontap-san
    fsType: ext4
    provisioningType: thin
    snapshots: "true"
# ================================================================================
# SECRET - Credenciales de acceso y CHAP
# ================================================================================
# El secret de Kubernetes contiene:
#   - username: Usuario administrador del SVM (ej: vsadmin)
#   - password: Contraseña del usuario
#   - chapInitiatorSecret: Secret del iniciador (si useCHAP=true)
#   - chapTargetInitiatorSecret: Secret del target iniciador (si useCHAP=true)
#   - chapUsername: Usuario CHAP (si useCHAP=true)
#   - chapTargetUsername: Usuario CHAP del target (si useCHAP=true)
#   - clientCertificate: Certificado del cliente Base64 (si se usa auth por cert)
#   - clientPrivateKey: Clave privada del cliente Base64 (si se usa auth por cert)
#   - trustedCACertificate: Certificado CA Base64 (si se usa auth por cert)
#
# NOTA: Con TridentBackendConfig, los campos CHAP y de certificados van en el secret.
# Son "forbidden attributes" en el backend spec.
# El backend solo tiene useCHAP=true y referencia el secret mediante credentials.name
# ================================================================================