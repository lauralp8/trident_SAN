# ================================================================================
# SECRET - Credenciales de acceso, CHAP y Certificados
# ================================================================================
# Este Secret contiene:
#   - username: Usuario administrador del SVM (ej: vsadmin)
#   - password: Contraseña del usuario
#   - chapInitiatorSecret: Secret del iniciador (si useCHAP=true)
#   - chapTargetInitiatorSecret: Secret del target iniciador (si useCHAP=true)
#   - chapUsername: Usuario CHAP (si useCHAP=true)
#   - chapTargetUsername: Usuario CHAP del target (si useCHAP=true)
# 
# Campos opcionales para autenticación por certificados:
#   - clientCertificate: Certificado del cliente (Base64)
#   - clientPrivateKey: Clave privada del cliente (Base64)
#   - trustedCACertificate: Certificado CA de confianza (Base64)
#
# NOTA: Con TridentBackendConfig, los campos CHAP y de certificados van aquí.
# Son "forbidden attributes" en el backend spec.
# ================================================================================

apiVersion: v1
kind: Secret
metadata:
  name: trident-creds
type: Opaque
