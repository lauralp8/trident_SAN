# ================================================================================
# SECRET - Credenciales de acceso al SVM NetApp ONTAP
# ================================================================================
# Este Secret contiene SOLO las credenciales de acceso al SVM:
#   - username: Usuario administrador del SVM (ej: vsadmin)
#   - password: Contraseña del usuario
#
# NOTA IMPORTANTE: Los campos CHAP NO van en este secret.
# Según la documentación de NetApp Trident, los campos CHAP se definen
# directamente en el TridentBackendConfig spec (ver config.yaml).
# ================================================================================

apiVersion: v1
kind: Secret
metadata:
  name: trident-creds
type: Opaque
stringData:
  username: vsadmin 
  password: Netapp1!
